# .github/workflows/council.yml — copy this into the repository being cared for, after
# mounting the engine as a submodule:
#
#   git submodule add https://github.com/FCCN-ANTIBODY/advocate.anecdote.channel .advocate-engine
#
# One job per advocate in advocate.yml, from one matrix. Adding an advocate is a config
# change, never a new workflow.
#
# TRIGGERS ARE schedule AND workflow_dispatch ONLY, on purpose. Never add
# `pull_request_target`: an outside advocate's branch is READ, never RUN. Their credibility
# comes from you reading their reasoning, not from your CI executing their tree with your
# secrets.

name: council

on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays. Your cadence; change it.
  workflow_dispatch:
    inputs:
      advocate:
        description: "Run just this one (blank = all of them)"
        required: false

permissions:
  contents: write          # advocates push their own branch, and nothing else

concurrency:
  group: council-${{ github.ref }}
  cancel-in-progress: false

jobs:
  seats:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true      # .advocate-engine, mounted like every other engine here
      - id: read
        run: echo "matrix=$(node .advocate-engine/bin/seats.mjs --matrix)" >> "$GITHUB_OUTPUT"

  session:
    needs: seats
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.seats.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the range is the input; shallow hides it
          submodules: true

      - if: ${{ github.event.inputs.advocate == '' || github.event.inputs.advocate == matrix.name }}
        uses: ./.advocate-engine
        with:
          advocate: ${{ matrix.name }}
          # An FCCN-ANTIBODY org secret; ANTHROPIC_API_KEY is the fallback name judgement
          # uses. Blank => the session stages for a human and is never faked.
          agent-key: ${{ secrets.ADVOCATE_AGENT_KEY || secrets.ANTHROPIC_API_KEY }}
          # The Anthropic workspace id (`wrkspc_01...`, from the Anthropic Console) — not a
          # GitHub org or repo name. Only needed when the key is identity-linked. Not a
          # secret, so a variable is fine.
          workspace-id: ${{ vars.ADVOCATE_WORKSPACE_ID }}
