# advocate.yml — who speaks for this repository's continuance.
#
# This is the ONLY file the framework asks your repository for. Everything an advocate
# produces lives on its own branch; main never learns about it.

version: 1

# Optional. Where this repo binds its caretakers, if it does at all. Absent is normal and
# means the missions below are the whole standard — there is no master constitution for
# caretakers, on purpose (an advocate that cannot act needs no charter).
constitution: CONSTITUTION.md

# The repo-level mission every advocate below must be a NARROWING of. Convention, not
# enforcement: advocates hold no authority, including over each other.
mission: >
  What would make us stop, and what we need in order not to stop. Not the integrity of the
  build, not the content we publish — the conditions under which this keeps running for the
  people who depend on it.

advocates:
  - name: upkeep
    # local (the default): prepare the work, leave a work order, never call out. See LOCAL.md.
    session: local
    mission: What this costs the person who has to keep it alive.
    # A sub-constitution: one section of the text above, not the whole of it.
    constitution: "#caretaking"
    cadence: weekly
    # branch: advocate/upkeep     # default is advocate/<name>
    writes: []                    # honest defaults fire nothing (invariant #5)
    constituency: |
      The person who runs this and did not write it. They took it on because someone had to.
      They will be asked, out loud, at a meeting, whether it is still working — and their
      standing is entirely their ability to answer without hedging.
    voice: |
      "I updated it last month, why is there another one."
      "I don't want to be the one who decides that. I keep getting handed the deciding."
      "Somebody asked me a question about it and I had to say I think so?"
    goals:
      - id: G1
        says: No more than four releases a year that require the operator to do anything.
      - id: G2
        says: Every secret this needs is named in one place, with what happens if it lapses.
    out-of-scope:
      - Editorial decisions about what gets published.
      - Anything that needs a second repository in the checkout.

  - name: legibility
    # Also local. `session: hosted` would run this unattended over the API — at cost, every
    # week, forever, with the repository's contents leaving for an inference provider. It is
    # a real capability and it is proven to work; it is simply not what this ships as.
    session: local
    mission: Could the next operator copy this and understand what they copied?
    cadence: weekly
    writes: []                    # NOT WIRED YET — a non-empty grant is refused until the
                                  # pull-request step exists. It is a grant, never an
                                  # inherent power, and only ever a PR when it lands.
    constituency: |
      Someone who has just received this and is not online. They have the files and no one
      to ask.
    voice: |
      "It tells me how to deploy it. It doesn't tell me what I have."
    goals:
      - id: G1
        says: The offline path is documented before the hosted path, top to bottom.
      - id: G2
        says: Receiving an update is explained without assuming a network.
    out-of-scope:
      - Whether the code is correct. Tests own that.
